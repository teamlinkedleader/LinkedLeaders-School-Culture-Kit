# Netlify deploy config.
#
# Connect the repo at netlify.com (Add new site -> Import an existing project)
# and this is picked up automatically. Environment variables are set in the
# Netlify UI:
#
#   MAILERLITE_API_KEY   REQUIRED. MailerLite is the system of record for
#                        subscribers. Deliberately has NO VITE_ prefix: that is
#                        what keeps it out of the client bundle. Only the
#                        subscribe function ever reads it.
#
#   VITE_SUPABASE_URL          Optional now. Supabase is no longer written to on
#   VITE_SUPABASE_ANON_KEY     signup; these remain only so the client can be
#                              constructed without throwing. Safe to remove once
#                              the Supabase client is dropped entirely.
#
# Never put a MailerLite key or a Supabase SECRET key behind a VITE_ prefix.
# Everything in a Vite build is served to every visitor.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: any route other than "/" must fall through to index.html,
# otherwise a refresh or a deep link returns a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sensible defaults for a public marketing page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
