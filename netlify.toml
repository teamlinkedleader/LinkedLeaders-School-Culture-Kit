# Deploy config for Netlify. Unused until someone connects the repo in the
# Netlify UI; it costs nothing sitting here.
#
# Vercel needs no config file for a Vite app and will auto-detect this project.

[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: every route must fall through to index.html or a direct hit
# on anything other than "/" returns a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
