<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Build the School People Are Proud to Belong To | LinkedLeaders</title>
    <meta name="description" content="A full school year of culture-building activities for school leadership. One actionable idea delivered to your inbox each week, for staff morale, student belonging, and family connection." />
    <meta property="og:title" content="Build the School People Are Proud to Belong To" />
    <meta property="og:description" content="A full school year of culture-building activities for school leadership. Free to read, with one activity delivered per week." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      Netlify Forms detection.

      Netlify finds forms by parsing the HTML it deploys. The real form is a
      React component, which is not in this file at build time, so it would
      never be found. This hidden copy is what registers the form and its
      fields; the component posts to it.

      DO NOT DELETE. Removing this stops feedback submissions silently, with no
      error anywhere. Field names must stay in step with FeedbackBox.tsx.
    -->
    <form name="culture-kit-feedback" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="kind" />
      <textarea name="message"></textarea>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="consent" />
      <input type="text" name="access" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
